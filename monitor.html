<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>跟单监控 · 自选带单员</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --surface2:#fafbfc; --surface3:#f2f4f7;
  --line:#e9edf2; --line2:#dce2ea;
  --tx:#12161c; --tx2:#667085; --tx3:#98a2b3;
  --accent:#2563eb; --accent-soft:#eef4ff;
  --up:#d92d20; --down:#067647;
  --open:#0b6bcb; --open-soft:#eaf4ff;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 28px rgba(16,24,40,.06);
  --shadow-up:0 -8px 32px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d0f12; --surface:#171a1f; --surface2:#1c2026; --surface3:#22272e;
    --line:#262b32; --line2:#313741;
    --tx:#f2f4f7; --tx2:#a2acb9; --tx3:#767f8c;
    --accent:#5b8def; --accent-soft:#1b2a44;
    --up:#ff6b60; --down:#3ecf8e;
    --open:#6cb2ff; --open-soft:#172a40;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.25);
    --shadow-up:0 -8px 32px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:21px; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
button:disabled{opacity:.38;cursor:default}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.up{color:var(--up)} .down{color:var(--down)}

.app{max-width:1280px;margin:0 auto;padding:28px 24px 56px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.hd h1{margin:0;font-size:26px;line-height:32px;font-weight:600;letter-spacing:-.02em}
.hd-sub{margin:5px 0 0;font-size:13px;line-height:19px;color:var(--tx2)}
.hd-meta{font-size:13px;line-height:19px;color:var(--tx2);white-space:nowrap;text-align:right}

/* ---------- 搜索添加 ---------- */
.addbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;
        box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
.addbar-row{display:flex;gap:10px;align-items:center}
.addbar input{
  flex:1;min-width:0;height:42px;padding:0 13px;border-radius:10px;
  border:1px solid var(--line2);background:var(--surface2);font-size:14px;
}
.addbar input::placeholder{color:var(--tx3)}
.addbar input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.btn{height:42px;padding:0 18px;border-radius:10px;background:var(--accent);color:#fff;
     font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;
     align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface2);color:var(--tx);border:1px solid var(--line2);font-weight:500}
.addbar-hint{margin-top:9px;font-size:12px;line-height:18px;color:var(--tx3)}
.addbar-hint b{color:var(--tx2);font-weight:500}

.sres{margin-top:12px;border-top:1px solid var(--line);padding-top:6px;display:none}
.sres.show{display:block}
.sres-item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;
           align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sres-item:last-child{border-bottom:0}
.sres-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres-meta{margin-top:2px;font-size:12px;line-height:17px;color:var(--tx2)}
.sres-val{font-size:13px;text-align:right;white-space:nowrap}
.mini{height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line2);
      background:var(--surface);font-size:13px;color:var(--accent);font-weight:600}
.mini:hover{background:var(--accent-soft);border-color:var(--accent)}
.mini.done{color:var(--tx3);border-color:var(--line);font-weight:400}
.sres-msg{padding:10px 0;font-size:13px;line-height:19px;color:var(--tx2)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.seg{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line2);border-radius:11px}
.seg button{min-height:34px;padding:0 15px;border-radius:8px;font-size:13px;color:var(--tx2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.toolbar-note{font-size:13px;color:var(--tx2)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:20px;align-items:stretch}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}

.thead,.tr{
  display:grid;
  grid-template-columns:minmax(150px,1.6fr) 84px 118px 64px 104px 88px 56px 12px;
  gap:12px;align-items:center;padding:0 18px;
}
.thead{min-height:42px;border-bottom:1px solid var(--line2);font-size:11px;line-height:16px;
       letter-spacing:.05em;color:var(--tx3)}
.tr{width:100%;min-height:64px;border-bottom:1px solid var(--line);position:relative;
    cursor:pointer;text-align:left;transition:background 120ms ease-out}
.tr:last-of-type{border-bottom:0}
.tr:hover{background:var(--surface2)}
.tr.sel{background:var(--accent-soft)}
.tr.sel:before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;
               border-radius:0 3px 3px 0;background:var(--accent)}
.c-name{min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-size:15px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:none;font-size:12px;line-height:17px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-cc,.c-pnl,.c-sharpe,.c-last{text-align:right;white-space:nowrap}
.c-cc b{font-size:15px;font-weight:600}
.c-cc small{display:none}
.c-pnl{font-size:14px;font-weight:600}
.c-sharpe{font-size:13px;color:var(--tx2)}
.c-last{font-size:13px;color:var(--tx2)}
.c-pos{display:flex;align-items:center;gap:6px;min-width:0}
.c-sub{text-align:right}
.c-chev{font-size:18px;color:var(--tx3);text-align:right}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:18px;
       padding:1px 8px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.badge.open{background:var(--open-soft);color:var(--open);font-weight:600}
.badge.hide{background:var(--surface2);color:var(--tx3);border-color:var(--line2)}
.sub-btn{height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line2);
         background:var(--surface);font-size:12px;color:var(--tx2);white-space:nowrap}
.sub-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

.pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 16px;border-top:1px solid var(--line)}
.pager button{min-height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:9px;
             font-size:13px;color:var(--tx2);background:var(--surface)}
.pager button:hover:not(:disabled){background:var(--surface2)}
.pager .pg{min-width:36px;padding:0;text-align:center}
.pager .pg[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#pageInfo{display:none;font-size:13px;color:var(--tx2);min-width:64px;text-align:center}

.empty-state{padding:52px 24px;text-align:center}
.empty-state h3{margin:0 0 6px;font-size:16px;font-weight:600}
.empty-state p{margin:0;font-size:13px;line-height:20px;color:var(--tx2)}

/* PC：两栏等高，表头与分页常驻，列表内部滚动 */
@media (min-width:981px){
  .list-pane{display:flex;flex-direction:column;max-height:calc(100dvh - 300px)}
  .thead{flex:none}
  #list{flex:1;min-height:0;overflow-y:auto}
  .pager{flex:none}
  .detail-pane{max-height:calc(100dvh - 300px)}
}
.detail-pane{position:sticky;top:24px;display:flex;flex-direction:column;overflow:hidden}
.d-hd{padding:18px 18px 12px;border-bottom:1px solid var(--line2)}
.d-hd-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.d-name{font-size:19px;line-height:25px;font-weight:600}
.d-sub{margin-top:4px;font-size:12px;line-height:18px;color:var(--tx2)}
.d-act{display:flex;gap:8px;margin-top:11px}
.d-close{display:none;min-width:44px;min-height:44px;place-items:center;margin:-8px -10px 0 0;
         border-radius:10px;font-size:13px;color:var(--accent)}
.d-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
        padding:0 18px 18px}
.d-tabs{display:flex;flex:none;gap:2px;padding:0 10px;
        background:var(--surface);border-bottom:1px solid var(--line2)}
.d-tab{flex:1;min-width:0;min-height:44px;display:flex;align-items:center;justify-content:center;
       gap:5px;padding:0 3px;border:0;border-bottom:2px solid transparent;background:none;
       color:var(--tx2);font-size:13px;line-height:18px;font-weight:500;white-space:nowrap}
.d-tab[aria-selected="true"]{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.d-tab .n{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.d-tab[aria-selected="true"] .n{color:var(--accent)}
.d-tab .short{display:none}
.d-body>.sec:first-child{margin-top:14px}
.sec{margin-top:18px}
.sec-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.sec-t{font-size:14px;line-height:20px;font-weight:600}
.sec-n{font-size:12px;line-height:18px;color:var(--tx3)}
.item{padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-l1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.item-name{font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-tag{font-size:12px;color:var(--tx2);margin-left:6px;font-weight:400}
.item-val{font-size:14px;line-height:20px;font-weight:600;white-space:nowrap}
.item-l2{margin-top:3px;font-size:12px;line-height:17px;color:var(--tx2)}
.ord-side{font-weight:600}
.ord-side.buy{color:var(--accent)}
.ord-side.sell{color:var(--tx2)}
.item-val.flat{color:var(--tx3);font-weight:400}
.empty{padding:14px 0;font-size:13px;line-height:19px;color:var(--tx2)}
.note{margin-top:18px;padding-top:13px;border-top:1px solid var(--line);
      font-size:11px;line-height:17px;color:var(--tx3)}
.foot{margin-top:18px;text-align:center;font-size:12px;line-height:18px;color:var(--tx3)}
.mask{display:none}

/* ---------- 订阅弹窗 ---------- */
.sheet{position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-48%);
       width:min(440px,calc(100vw - 32px));background:var(--surface);border-radius:16px;
       border:1px solid var(--line2);box-shadow:0 24px 64px rgba(0,0,0,.24);
       opacity:0;visibility:hidden;transition:opacity 180ms ease-out,transform 180ms ease-out,visibility 180ms}
.sheet.open{opacity:1;visibility:visible;transform:translate(-50%,-50%)}
.sheet-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 0}
.sheet-t{font-size:16px;line-height:22px;font-weight:600}
.sheet-s{margin-top:3px;font-size:12px;line-height:18px;color:var(--tx2)}
.sheet-x{min-width:44px;min-height:32px;text-align:right;font-size:13px;color:var(--tx2)}
.sheet-bd{padding:14px 18px 18px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:11px 0;border-bottom:1px solid var(--line)}
.kv:last-of-type{border-bottom:0}
.kv-k{font-size:12px;color:var(--tx3);flex:none;width:72px}
.kv-v{flex:1;min-width:0;font-size:13px;line-height:19px;word-break:break-all;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--tx)}
.kv .mini{flex:none;height:30px;padding:0 11px}
.sheet-tip{margin-top:12px;font-size:12px;line-height:19px;color:var(--tx2)}
.sheet-tip ol{margin:6px 0 0;padding-left:18px}
.sheet-tip li{margin:2px 0}
.sheet-ft{padding:0 18px 18px;display:flex;gap:8px}
.sheet-ft .btn{flex:1}
.danger{color:var(--up);border-color:var(--line2);background:var(--surface)}

@media (max-width:980px){
  .app{padding:0;background:var(--surface)}
  .hd{display:block;position:sticky;top:0;z-index:6;background:var(--surface);
      margin:0;padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
  .hd h1{font-size:20px;line-height:26px}
  .hd-sub{margin-top:3px;font-size:12px;line-height:17px}
  .hd-meta{margin-top:3px;text-align:left;font-size:12px;line-height:17px}
  .addbar{margin:12px 16px;padding:12px 13px;border-radius:12px}
  .addbar input{height:40px}
  .btn{height:40px;padding:0 15px}
  .addbar-hint{font-size:12px;line-height:17px}
  .toolbar{padding:0 16px 10px;margin:0;background:var(--surface)}
  .toolbar-note{display:none}
  .pane{border:0;border-radius:0;box-shadow:none}
  .layout{display:block}
  .thead{display:none}
  .tr{
    grid-template-columns:minmax(0,1fr) auto auto 12px;
    grid-template-areas:"name pnl pnl chev" "meta meta sub chev";
    gap:5px 10px;min-height:84px;padding:12px 16px;
  }
  .c-name{grid-area:name}
  .nm{font-size:16px;line-height:21px}
  .sub{display:block}
  .c-pnl{grid-area:pnl;align-self:start;font-size:15px}
  .c-cc,.c-sharpe,.c-last{display:none}
  .c-pos{grid-area:meta;display:flex;align-items:center;gap:8px;justify-content:flex-start}
  .c-sub{grid-area:sub;align-self:center;justify-self:end}
  .c-chev{grid-area:chev;align-self:center}
  .pager{padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
  .pager .pg{display:none}
  #pageInfo{display:block}
  .foot{padding:0 16px calc(24px + env(safe-area-inset-bottom))}
  .sres-item{grid-template-columns:minmax(0,1fr) auto;gap:8px}

  .detail-pane{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;
    max-height:86dvh;border-radius:18px 18px 0 0;border:1px solid var(--line2);border-bottom:0;
    height:86dvh;box-shadow:var(--shadow-up);padding-bottom:env(safe-area-inset-bottom);
    transform:translateY(103%);visibility:hidden;transition:transform 220ms ease-out,visibility 220ms;
  }
  .detail-pane.open{transform:translateY(0);visibility:visible}
  .d-close{display:grid}
  .d-tab .full{display:none}
  .d-tab .short{display:inline}
  .mask{display:block;position:fixed;inset:0;z-index:19;background:rgba(16,24,40,.36);
        opacity:0;pointer-events:none;transition:opacity 200ms ease-out}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{left:0;right:0;top:auto;bottom:0;width:auto;transform:translateY(100%);
         border-radius:18px 18px 0 0;border-bottom:0;max-height:88dvh;overflow-y:auto;
         padding-bottom:env(safe-area-inset-bottom);z-index:31;
         transition:transform 220ms ease-out,visibility 220ms,opacity 180ms}
  .sheet.open{transform:translateY(0)}
}
@media (min-width:700px) and (max-width:980px){
  .detail-pane{left:50%;right:auto;width:520px;transform:translate(-50%,103%)}
  .detail-pane.open{transform:translate(-50%,0)}
  .app{max-width:640px;margin:0 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="hd">
    <div>
      <h1>跟单监控</h1>
      <p class="hd-sub" id="hdSub">自选带单员 · 一人一个推送主题</p>
      <div class="hd-meta num" id="hdMeta">—</div>
    </div>
    <div class="hd-meta num" id="hdTime"></div>
  </header>

  <div class="addbar">
    <div class="addbar-row">
      <input id="q" type="search" inputmode="search" autocomplete="off"
             placeholder="搜索带单员昵称，或粘贴主页链接">
      <button class="btn" type="button" id="go">搜索</button>
    </div>
    <div class="addbar-hint" id="hint">昵称模糊匹配；也可以直接粘贴带单员主页链接或 ID。</div>
    <div class="sres" id="sres"></div>
  </div>

  <div class="toolbar">
    <div class="seg" id="seg">
      <button type="button" data-f="all" aria-pressed="true">全部</button>
      <button type="button" data-f="open" aria-pressed="false">仅公开持仓</button>
    </div>
    <span class="toolbar-note num" id="rangeNote"></span>
  </div>

  <div class="layout">
    <section class="pane list-pane" aria-label="监控名单">
      <div class="thead">
        <span>带单员</span><span style="text-align:right">跟单人数</span>
        <span style="text-align:right">跟单者盈亏</span><span style="text-align:right">夏普</span>
        <span style="text-align:right">最近交易</span><span>持仓</span><span style="text-align:right">订阅</span><span></span>
      </div>
      <div id="list"></div>
      <div class="pager">
        <button type="button" id="prev">上一页</button>
        <span id="pageNums"></span>
        <span class="num" id="pageInfo"></span>
        <button type="button" id="next">下一页</button>
      </div>
    </section>

    <aside class="pane detail-pane" id="detail" role="dialog" aria-modal="false" aria-labelledby="dName">
      <div class="d-hd">
        <div class="d-hd-top">
          <div style="min-width:0">
            <div class="d-name" id="dName">—</div>
            <div class="d-sub num" id="dSub"></div>
          </div>
          <button type="button" class="d-close" id="dClose" aria-label="关闭">关闭</button>
        </div>
        <div class="d-act" id="dAct"></div>
      </div>
      <div class="d-tabs" id="dTabs" role="tablist" aria-label="详情分类">
        <button type="button" class="d-tab" data-t="pos" role="tab" aria-selected="false" aria-controls="dBody">
          <span class="full">当前仓位</span><span class="short">仓位</span><span class="n" id="nPos">0</span></button>
        <button type="button" class="d-tab" data-t="recent" role="tab" aria-selected="false" aria-controls="dBody">
          <span class="full">最近平仓</span><span class="short">平仓</span><span class="n" id="nRecent">0</span></button>
        <button type="button" class="d-tab" data-t="orders" role="tab" aria-selected="true" aria-controls="dBody">
          <span class="full">最新交易记录</span><span class="short">交易</span><span class="n" id="nOrders">0</span></button>
      </div>
      <div class="d-body" id="dBody" role="tabpanel"></div>
    </aside>
  </div>

  <p class="foot">盈亏为跟单者视角的累计金额（USDT）；仓位、平仓与订单均为播报口径，存在数分钟延迟。</p>
</div>
<div class="mask" id="mask"></div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetT">
  <div class="sheet-hd">
    <div style="min-width:0">
      <div class="sheet-t" id="sheetT">订阅推送</div>
      <div class="sheet-s" id="sheetS"></div>
    </div>
    <button type="button" class="sheet-x" id="sheetX">关闭</button>
  </div>
  <div class="sheet-bd" id="sheetBd"></div>
  <div class="sheet-ft">
    <button type="button" class="btn" id="copyAll">复制订阅地址</button>
    <button type="button" class="btn ghost danger" id="unwatch">移出监控</button>
  </div>

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];

function money(v, d){
  var n = Number(v);
  if (v == null || !isFinite(n)) return '—';
  var k = d == null ? 0 : d;
  return (n >= 0 ? '+' : '−') + Math.abs(n).toLocaleString('zh-CN',

}
function price(v){
  var n = Number(v);
  if (!isFinite(n) || n === 0) return '—';
  return Math.abs(n) >= 1 ? n.toFixed(2) : String(Number(n.toPrecision(6)));
}
function cls(v){ return Number(v) >= 0 ? 'up' : 'down'; }
function tm(ms){
  var n = Number(ms);
  if (!isFinite(n) || n < 1e12) return '—';
  var d = new Date(n), p = function(x){ return (x < 10 ? '0' : '') + x; };
  return p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function ago(ms){
  var n = Number(ms);
  if (!isFinite(n) || n < 1e12) return '—';
  var s = (Date.now() - n) / 1000;
  if (s < 0) return '刚刚';
  if (s < 90) return '刚刚';
  if (s < 3600) return Math.round(s / 60) + ' 分钟前';
  if (s < 86400) return Math.round(s / 3600) + ' 小时前';
  if (s < 86400 * 30) return Math.round(s / 86400) + ' 天前';
  return tm(n);
}
function side(s){

  if (u.indexOf('SHORT') === 0) return '空';
  if (u === 'BOTH') return '双向';
  return u || '—';
}
function lev(v){ return (v == null || v === '' || Number(v) === 0) ? '' : Number(v) + 'x'; }
function mobile(){ return window.matchMedia('(max-width:980px)').matches; }
function findLeader(pid){
  for (var i = 0; i < data.leaders.length; i++) if (data.leaders[i].pid === pid) return data.leaders[i];
  return null;
}
function rows(){
  return st.filter === 'open' ? data.leaders.filter(function(r){ return r.show; }) : data.leaders;
}
function ntfyBase(){ return data.ntfy_url || ''; }
function subUrl(r){ return ntfyBase() + '/' + (r.topic || r.slug || ''); }

function rowHtml(r){
  var badge = r.show
    ? '<span class="badge open"><span class="dot"></span>公开持仓</span>'
    : '<span class="badge hide">未公开</span>';
  var pnlCls = r.copier_pnl == null ? '' : cls(r.copier_pnl);
  var sharpe = (r.sharpe == null) ? '—' : Number(r.sharpe).toFixed(2);
  return '<div class="tr' + (st.pid === r.pid ? ' sel' : '') + '" role="button" tabindex="0" data-pid="' + esc(r.pid) + '">' +
    '<span class="c-name"><span class="nm">' + esc(r.name) + '</span>' +
      '<span class="sub num">' + Number(r.cc || 0).toLocaleString('zh-CN') + ' 人跟单 · ' +
        (r.copier_pnl == null ? '—' : money(r.copier_pnl) + ' USDT') + '</span></span>' +
    '<span class="c-cc"><b class="num">' + Number(r.cc || 0).toLocaleString('zh-CN') + '</b><small>人</small></span>' +
    '<span class="c-pnl num ' + pnlCls + '">' + money(r.copier_pnl) + '</span>' +
    '<span class="c-sharpe num">' + sharpe + '</span>' +
    '<span class="c-last num">' + ago(r.last_trade_at) + '</span>' +
    '<span class="c-pos">' + badge + '</span>' +
    '<span class="c-sub"><button type="button" class="sub-btn" data-sub="' + esc(r.pid) + '">订阅</button></span>' +
    '<span class="c-chev">›</span></div>';
}

function renderPager(pages, total, size){
  var nums = [], i;
  for (i = 1; i <= pages; i++){
    nums.push('<button type="button" class="pg num" data-p="' + i + '"' +
      (i === st.page ? ' aria-current="true"' : '') + '>' + i + '</button>');
  }
  document.getElementById('pageNums').innerHTML = pages > 1 ? nums.join('') : '';
  document.getElementById('pageInfo').textContent = st.page + ' / ' + pages;
  document.getElementById('prev').disabled = st.page <= 1;
  document.getElementById('next').disabled = st.page >= pages;
  var from = total ? (st.page - 1) * size + 1 : 0;
  var to = Math.min(st.page * size, total);
  document.getElementById('rangeNote').textContent =
    total ? '第 ' + from + '–' + to + ' 人，共 ' + total + ' 人' : '';
  document.querySelector('.pager').style.display = total > size ? 'flex' : 'none';
}

function render(){
  var all = data.leaders || [];
  var openCount = all.filter(function(r){ return r.show; }).length;
  var seg = document.querySelectorAll('#seg button');
  seg[0].textContent = '全部 ' + all.length;
  seg[1].textContent = '仅公开持仓 ' + openCount;
  for (var k = 0; k < seg.length; k++)
    seg[k].setAttribute('aria-pressed', seg[k].getAttribute('data-f') === st.filter ? 'true' : 'false');
  document.getElementById('hdMeta').textContent =
    all.length ? (all.length + ' 人监控中 · ' + openCount + ' 人公开持仓') : '还没有监控任何人';
  document.getElementById('hdTime').textContent = data.updated_at ? '数据 ' + data.updated_at.slice(5, 16) : '';

  var size = pageSize();
  var rs = rows(), pages = Math.max(1, Math.ceil(rs.length / size));
  if (st.page > pages) st.page = pages;
  var slice = rs.slice((st.page - 1) * size, st.page * size);
  var listEl = document.getElementById('list');
  if (!all.length){
    listEl.innerHTML = '<div class="empty-state"><h3>监控名单是空的</h3>' +
      '<p>在上面搜索昵称，或粘贴带单员主页链接，加进来就会自动生成一个专属推送主题。</p></div>';
  } else if (!rs.length){
    listEl.innerHTML = '<div class="empty-state"><h3>没有公开持仓的人</h3>' +
      '<p>切回「全部」可以看到全部监控对象。</p></div>';
  } else {
    listEl.innerHTML = slice.map(rowHtml).join('');
  }
  renderPager(pages, rs.length, size);
  if (st.pid) {
    var rowsEl = document.querySelectorAll('.tr');
    for (var i = 0; i < rowsEl.length; i++)
      rowsEl[i].classList.toggle('sel', rowsEl[i].getAttribute('data-pid') === st.pid);
  }
}

function tradeHtml(x){
  return '<div class="item"><div class="item-l1">' +
    '<span class="item-name">' + esc(x.symbol) +
      '<span class="item-tag">' + side(x.side) + (lev(x.lev) ? ' · ' + lev(x.lev) : '') + '</span></span>' +
    '<span class="item-val num ' + cls(x.pnl) + '">' + money(x.pnl, 2) + '</span></div>' +
    '<div class="item-l2 num">' + tm(x.closed) + ' · ' + price(x.o) + ' → ' + price(x.c) +
      (x.hold != null ? ' · ' + (x.hold >= 0.1 ? '持仓 ' + x.hold + 'h' : '短仓') : '') +
    '</div></div>';
}
function posHtml(x){
  return '<div class="item"><div class="item-l1">' +
    '<span class="item-name">' + esc(x.symbol) + '<span class="item-tag">' + side(x.side) + '</span></span>' +
    '<span class="item-val num ' + cls(x.pnl) + '">' + money(x.pnl, 2) + '</span></div>' +
    '<div class="item-l2 num">' + (x.amount == null ? '—' : Number(x.amount)) + ' 张 · ' +
      price(x.entry) + ' → ' + price(x.mark) + '</div></div>';
}
function orderHtml(x){
  var buy = x.side === 'BUY';
  var act = '<span class="ord-side ' + (buy ? 'buy' : 'sell') + '">' +
    (buy ? '买入' : '卖出') + '</span>';
  return '<div class="item"><div class="item-l1">' +
    '<span class="item-name">' + esc(x.symbol) +
      '<span class="item-tag">' + act + ' · ' + side(x.ps) +
        (x.type === 'LIMIT' ? ' · 限价' : x.type === 'MARKET' ? ' · 市价' : '') + '</span></span>' +
    '<span class="item-val num ' + (x.pnl ? cls(x.pnl) : 'flat') + '">' +
      (x.pnl ? money(x.pnl, 2) : '—') + '</span></div>' +
    '<div class="item-l2 num">' + tm(x.t) + ' · ' + price(x.px) + ' × ' + x.qty +
    '</div></div>';
}
function detailHtml(d, tab){
  var p = [], note = '';
  if (tab === 'recent'){
    var recent = d.recent || [];
    p.push('<div class="sec"><div class="sec-hd"><span class="sec-t">最近平仓</span>' +
      '<span class="sec-n num">最近 ' + recent.length + ' 笔</span></div>');
    if (!recent.length) p.push('<div class="empty">暂无平仓记录。</div>');
    else p.push(recent.map(tradeHtml).join(''));
    note = '已平仓仓位汇总，带开仓价 / 平仓价 / 持仓时长；存在数分钟到约一小时延迟。';
  } else if (tab === 'orders'){
    var ords = d.orders || [];
    var ordNote = '最近 ' + ords.length + ' 笔' +
      (d.orders_total ? ' · 共 ' + Number(d.orders_total).toLocaleString('zh-CN') + ' 笔' : '');
    p.push('<div class="sec"><div class="sec-hd"><span class="sec-t">最新交易记录</span>' +
      '<span class="sec-n num">' + ordNote + '</span></div>');
    if (!ords.length) p.push('<div class="empty">暂无订单记录。</div>');
    else p.push(ords.map(orderHtml).join(''));
    note = '逐笔委托（含开仓单），买卖方向是订单原始字段，不代表开仓或平仓；' +
      '已实现盈亏为 0 时显示「—」，延迟约数分钟。';
  } else {
    p.push('<div class="sec"><div class="sec-hd"><span class="sec-t">当前仓位</span>' +
      '<span class="sec-n">' + (d.show ? '持仓已公开' : '持仓未公开') + '</span></div>');
    if (!d.show) p.push('<div class="empty">该带单员未公开实时持仓。可切到「最新交易记录」查看其委托。</div>');
    else if (!d.pos || !d.pos.length) p.push('<div class="empty">当前无持仓。</div>');
    else p.push(d.pos.map(posHtml).join(''));
    note = '当前仓位为快照，接口不带时间戳；盈亏为未实现金额（USDT）。';
  }
  p.push('</div>');
  p.push('<div class="note">数据时间 ' + esc(d.updated_at || data.updated_at || '') +
    '。' + note + '</div>');
  return p.join('');
}

function fillDetail(r, d){
  document.getElementById('dName').textContent = r.name;
  document.getElementById('dSub').textContent =
    '跟单 ' + Number(r.cc || 0).toLocaleString('zh-CN') + ' 人' +
    (r.max_cc ? ' / 上限 ' + Number(r.max_cc).toLocaleString('zh-CN') : '') +
    ' · ' + (r.copier_pnl == null ? '' : '跟单者盈亏 ' + money(r.copier_pnl) + ' USDT · ') +
    '最近交易 ' + ago(r.last_trade_at);
  document.getElementById('dAct').innerHTML =
    '<button type="button" class="mini" data-sub="' + esc(r.pid) + '">订阅推送</button>' +
    '<button type="button" class="mini" data-open-ntfy="1">打开订阅地址</button>';
  var counts = {
    pos: d.show ? (d.pos || []).length : '—',
    recent: (d.recent || []).length,
    orders: (d.orders || []).length
  };
  var ids = { pos: 'nPos', recent: 'nRecent', orders: 'nOrders' };
  var tabs = document.querySelectorAll('#dTabs .d-tab');
  for (var i = 0; i < tabs.length; i++){
    var t = tabs[i].getAttribute('data-t');
    tabs[i].setAttribute('aria-selected', t === st.tab ? 'true' : 'false');
    document.getElementById(ids[t]).textContent = counts[t];
  }
  document.getElementById('dBody').innerHTML = detailHtml(d, st.tab);
}

function showDetail(pid, popup){
  var r = findLeader(pid);
  if (!r) return;
  st.pid = pid;
  if (!cache[pid]) cache[pid] = {
    show: r.show, pos: r.pos || [], recent: r.recent || [],
    orders: r.orders || [], orders_total: r.orders_total || 0,
    updated_at: data.updated_at
  };
  fillDetail(r, cache[pid]);
  var box = document.getElementById('detail');
  if (popup && mobile()){
    box.classList.add('open');
    document.getElementById('mask').classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  var rowsEl = document.querySelectorAll('.tr');
  for (var i = 0; i < rowsEl.length; i++)
    rowsEl[i].classList.toggle('sel', rowsEl[i].getAttribute('data-pid') === pid);

  fetch('/api/trader?pid=' + encodeURIComponent(pid))
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(d){
      if (!d || d.error || (!d.recent && !d.orders)) return;
      cache[pid] = d;
      if (st.pid !== pid) return;
      var cur = findLeader(pid);
      if (cur) fillDetail(cur, d);
    }).catch(function(){});
}
function closeDetail(){
  document.getElementById('detail').classList.remove('open');
  document.getElementById('mask').classList.remove('show');
  document.body.style.overflow = '';
}

/* ---------------- 订阅 ---------------- */
function copyText(text, btn){
  var done = function(){
    if (!btn) return;
    var old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(function(){ btn.textContent = old; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text, done); });
  } else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(ta);
}
function openSub(pid){
  var r = findLeader(pid);
  if (!r) return;
  var base = ntfyBase(), url = subUrl(r);
  document.getElementById('sheetT').textContent = '订阅 ' + r.name;
  document.getElementById('sheetS').textContent = '开平仓推送到这个主题，一个人一个主题，互不打扰。';
  document.getElementById('sheetBd').innerHTML =
    '<div class="kv"><span class="kv-k">服务器</span>' +
      '<span class="kv-v" id="kvBase">' + esc(base) + '</span>' +
      '<button type="button" class="mini" data-copy="' + esc(base) + '">复制</button></div>' +
    '<div class="kv"><span class="kv-k">主题</span>' +
      '<span class="kv-v" id="kvTopic">' + esc(r.topic) + '</span>' +
      '<button type="button" class="mini" data-copy="' + esc(r.topic) + '">复制</button></div>' +
    '<div class="kv"><span class="kv-k">完整地址</span>' +
      '<span class="kv-v" id="kvUrl">' + esc(url) + '</span>' +
      '<button type="button" class="mini" data-copy="' + esc(url) + '">复制</button></div>' +
    '<div class="sheet-tip">怎么用：<ol>' +
      '<li>手机装 ntfy 客户端（App Store / Google Play 搜 ntfy，免费，不用注册）</li>' +
      '<li>在客户端里「添加服务器」，填上面的服务器地址</li>' +
      '<li>订阅主题 <b>' + esc(r.topic) + '</b>，有开平仓就会收到通知</li></ol></div>';
  document.getElementById('unwatch').style.display = ADMIN ? '' : 'none';
  document.getElementById('unwatch').setAttribute('data-pid', pid);
  document.getElementById('copyAll').setAttribute('data-pid', pid);
  var s = document.getElementById('sheet');
  s.classList.add('open');
  document.getElementById('mask').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeSub(){
  document.getElementById('sheet').classList.remove('open');
  document.getElementById('mask').classList.remove('show');
  document.body.style.overflow = '';
}

/* ---------------- 搜索与添加 ---------------- */
function hint(text){
  var el = document.getElementById('hint');
  if (text == null){ el.innerHTML = '昵称模糊匹配；也可以直接粘贴带单员主页链接或 ID。'; return; }
  el.innerHTML = text;
}
function sresMsg(html){
  var box = document.getElementById('sres');
  box.classList.add('show');
  box.innerHTML = '<div class="sres-msg">' + html + '</div>';
}
function renderSearch(list){
  var box = document.getElementById('sres');
  if (!list || !list.length){
    sresMsg('没有搜到。换个关键词试试，或者直接粘贴带单员主页链接。');
    return;
  }
  box.innerHTML = list.map(function(r){
    return '<div class="sres-item"><div><div class="sres-name">' + esc(r.name) + '</div>' +
      '<div class="sres-meta num">跟单 ' + Number(r.cc || 0).toLocaleString('zh-CN') +
        ' 人 · 跟单者盈亏 ' + money(r.copier_pnl) + ' · ID ' + esc(String(r.pid).slice(-8)) + '</div></div>' +
      '<div class="sres-val num">' + (r.watched ? '' : '') + '</div>' +
      (r.watched
        ? '<span class="mini done">已监控</span>'
        : '<button type="button" class="mini" data-add="' + esc(r.pid) + '">添加</button>') +
      '</div>';
  }).join('');
  box.classList.add('show');
}
function doSearch(){
  var q = document.getElementById('q').value.trim();
  if (!q) return;
  if (!ADMIN){
    showAddHelp();
    return;
  }
  sresMsg('搜索中…');
  var looksUrl = /\d{15,20}/.test(q);
  if (looksUrl){
    addTarget(q, true);
    return;
  }
  fetch('/api/search?q=' + encodeURIComponent(q))
    .then(function(res){ if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
    .then(function(d){ renderSearch(d.list || []); })
    .catch(function(){ showAddHelp(); });
}
function addTarget(target, silent){
  if (!ADMIN){ showAddHelp(); return; }
  var box = document.getElementById('sres');
  box.classList.add('show');
  box.innerHTML = '<div class="sres-msg">正在拉取带单员信息…</div>';
  fetch('/api/add', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ target: target })
  }).then(function(res){ return res.json().then(function(d){ return { ok: res.ok, d: d }; }); })
    .then(function(r){
      if (!r.ok || !r.d.ok){
        sresMsg('添加失败：' + esc((r.d && r.d.error) || '未知错误'));
        return;
      }
      var entry = r.d.entry || {};
      box.innerHTML = '<div class="sres-msg">已加入 <b>' + esc(entry.name || '') + '</b>' +
        '，主题 <b>' + esc(entry.topic || '') + '</b>。' +
        (r.d.reused ? '（原本就在名单里）' : '正在拉取这个人的仓位与交易，几秒后出现在列表里…') +
        ' <button type="button" class="mini" data-sub="' + esc(entry.pid) + '">看订阅地址</button></div>';
      setTimeout(loadData, 2500);
      setTimeout(loadData, 7000);
    })
    .catch(function(){ showAddHelp(); });
}
function showAddHelp(){
  var repo = 'https://github.com/dzp181/binance-copytrade-monitor';
  sresMsg('这个页面是只读的线上快照，不能直接加人。<br>' +
    '加人的两个入口：<br>1. 本机运行 <b>python3 trader_alert.py --web</b>，在本地面板里搜；<br>' +
    '2. 在仓库 <a href="' + repo + '/actions/workflows/refresh.yml" target="_blank" rel="noopener">' +
    'Actions → 币安跟单刷新</a> 里手动运行，填 search 搜人、填 add_pid 加人。');
}

/* ---------------- 事件 ---------------- */
document.getElementById('list').addEventListener('click', function(e){
  var sub = e.target.closest ? e.target.closest('[data-sub]') : null;
  if (sub){ e.stopPropagation(); openSub(sub.getAttribute('data-sub')); return; }
  var row = e.target.closest ? e.target.closest('.tr') : null;
  if (row) showDetail(row.getAttribute('data-pid'), true);
});
document.getElementById('list').addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var row = e.target.closest ? e.target.closest('.tr') : null;
  if (row){ e.preventDefault(); showDetail(row.getAttribute('data-pid'), true); }
});
document.getElementById('seg').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  st.filter = b.getAttribute('data-f');
  st.page = 1;
  render();
});
document.getElementById('pageNums').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  st.page = Number(b.getAttribute('data-p'));
  render();
});
document.getElementById('prev').addEventListener('click', function(){
  if (st.page > 1){ st.page--; render(); window.scrollTo({top:0, behavior:'smooth'}); }
});
document.getElementById('next').addEventListener('click', function(){
  st.page++; render(); window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('dTabs').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('.d-tab') : null;
  if (!b) return;
  st.tab = b.getAttribute('data-t');
  var r = findLeader(st.pid), d = cache[st.pid];
  if (r && d) fillDetail(r, d);
  document.getElementById('dBody').scrollTop = 0;
});
document.getElementById('dAct').addEventListener('click', function(e){
  var sub = e.target.closest ? e.target.closest('[data-sub]') : null;
  if (sub){ openSub(sub.getAttribute('data-sub')); return; }
  var open = e.target.closest ? e.target.closest('[data-open-ntfy]') : null;
  if (open && st.pid){
    var r = findLeader(st.pid);
    if (r) window.open(subUrl(r), '_blank', 'noopener');
  }
});
document.getElementById('dClose').addEventListener('click', closeDetail);
document.getElementById('mask').addEventListener('click', function(){ closeDetail(); closeSub(); });
document.getElementById('sheetX').addEventListener('click', closeSub);
document.getElementById('sheetBd').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-copy]') : null;
  if (b) copyText(b.getAttribute('data-copy'), b);
});
document.getElementById('copyAll').addEventListener('click', function(){
  var pid = this.getAttribute('data-pid');
  var r = findLeader(pid);
  if (r) copyText(subUrl(r), this);
});
document.getElementById('unwatch').addEventListener('click', function(){
  var pid = this.getAttribute('data-pid');
  if (!pid || !ADMIN) return;
  if (!confirm('把这个带单员移出监控？主题会失效。')) return;
  fetch('/api/remove', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pid: pid })
  }).then(function(res){ return res.json(); }).then(function(d){
    if (d && d.ok){ closeSub(); closeDetail(); loadData(); }
  }).catch(function(){});
});
document.getElementById('go').addEventListener('click', doSearch);
document.getElementById('q').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); doSearch(); }
});
document.getElementById('sres').addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-add]') : null;
  if (b){ addTarget(b.getAttribute('data-add')); return; }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ closeDetail(); closeSub(); }
});
window.addEventListener('resize', function(){
  if (!mobile()) closeDetail();
  render();
});

function loadData(){
  return fetch('/api/data')
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(d){
      if (!d || !d.leaders) return;
      data = d; cache = {}; render();
      if (location.search.indexOf('pid=') > 0){
        var pid = decodeURIComponent((location.search.match(/pid=(\d+)/) || [])[1] || '');
        if (pid && findLeader(pid)) showDetail(pid, true);
      }
    }).catch(function(){});
}
setInterval(loadData, 60000);

render();
if (!mobile() && data.leaders.length) showDetail(data.leaders[0].pid, false);
if (!ADMIN) hint('线上是只读快照；点「搜索」可以看怎么添加监控对象。');
</script>
